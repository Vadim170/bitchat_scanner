name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            keystore_path="${RUNNER_TEMP}/release.keystore"
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

            {
              echo "ANDROID_KEYSTORE_PATH=${keystore_path}"
              echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
            } >> "${GITHUB_ENV}"

            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Android signing secrets are not configured. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect release metadata
        id: metadata
        run: |
          set -euo pipefail

          metadata_file="app/build/outputs/apk/release/output-metadata.json"
          version_name="$(jq -r '.elements[0].versionName' "${metadata_file}")"
          version_code="$(jq -r '.elements[0].versionCode' "${metadata_file}")"
          output_file="$(jq -r '.elements[0].outputFile' "${metadata_file}")"
          source_apk="app/build/outputs/apk/release/${output_file}"
          tag_name="v${version_name}"

          if [[ ! -f "${source_apk}" ]]; then
            echo "Release APK not found at ${source_apk}" >&2
            exit 1
          fi

          release_apk="bitchat-scanner-v${version_name}.apk"

          cp "${source_apk}" "${release_apk}"

          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "tag_name=${tag_name}"
            echo "release_apk=${release_apk}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate version tag
        env:
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "${TAG_NAME}")"

            if [[ "${tagged_sha}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${TAG_NAME} already points to ${tagged_sha}. Bump versionName/versionCode before publishing a new release." >&2
              exit 1
            fi
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          RELEASE_APK: ${{ steps.metadata.outputs.release_apk }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.txt"
          printf 'Release APK for version %s (versionCode %s).\n' "${VERSION_NAME}" "${VERSION_CODE}" > "${notes_file}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            while IFS= read -r asset_name; do
              [[ -z "${asset_name}" ]] && continue
              gh release delete-asset "${TAG_NAME}" "${asset_name}" --yes
            done < <(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name | select(endswith(".apk"))')

            gh release upload "${TAG_NAME}" "${RELEASE_APK}" --clobber
            gh release edit "${TAG_NAME}" --title "${TAG_NAME}" --notes-file "${notes_file}" --latest
          else
            gh release create "${TAG_NAME}" "${RELEASE_APK}" \
              --title "${TAG_NAME}" \
              --notes-file "${notes_file}" \
              --latest \
              --target "${GITHUB_SHA}"
          fi
